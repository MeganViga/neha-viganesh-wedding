name = "neha-viganesh-wedding"
main = "worker.js"
compatibility_date = "2026-09-15"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[durable_objects]
bindings = [{ name = "VOW_STORE", class_name = "VowStore" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VowStore"]
