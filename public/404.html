<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Neha &amp; Viganesh</title>
    <script>
      (function () {
        var base = "/neha-viganesh-wedding/";
        var extra = location.pathname.indexOf(base) === 0
          ? location.pathname.slice(base.length)
          : location.pathname.replace(/^\//, "");
        extra = extra.replace(/\/+$/, "");
        location.replace(base + (extra ? "#/" + extra : ""));
      })();
    </script>
  </head>
  <body></body>
</html>
